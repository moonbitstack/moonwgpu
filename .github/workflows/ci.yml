name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master
  # Twice a month, so a new toolchain or a dependency's release shows up while nothing is pushed.
  schedule:
    - cron: "29 3 1,16 * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

  conformance:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The two pinned references: the specification the rules come from, and
      # the suite whose shape conformance/ follows. The suite itself is not run
      # here - it drives navigator.gpu from TypeScript - so what is checked is
      # the index it produced and the ledger that points into this repository.
      - name: the pinned references
        run: |
          git submodule update --init --depth 1 spec cts
          git -C cts sparse-checkout set --cone src/webgpu

      - name: the case index is current
        run: python3 scripts/cts_index.py --check

      - name: every claim resolves
        run: python3 scripts/cts_check.py

      - name: the tables match the specification
        run: python3 scripts/spec_drift.py

  backends:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      # One source tree and four backends. `moon check` says a backend builds,
      # which is not the same claim as "the same tests pass there"; this is the
      # second claim, and conformance/targets.json is where it is recorded.
      - name: every backend runs the same suite
        run: python3 scripts/targets.py --check

      # And one of those backends can be driven from JavaScript, which is the
      # only shape a suite written for navigator.gpu can have here.
      - name: a JavaScript host drives the js backend
        run: |
          moon build --target js
          node conformance/js/run.mjs


  # The one job that runs on a device. Mesa's lavapipe is a Vulkan
  # implementation in software, so the four ways bytes move are checked here
  # with nothing but a CPU: a clear, a triangle against its own coverage, a
  # compute dispatch read back word by word, and an upload that comes back
  # unchanged.
  vulkan:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install the software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools glslang-tools

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      - name: a device is present
        run: vulkaninfo --summary

      # The modules in `src/shaders` are what these sources compile to; a
      # source that changed without the words is a stale shader.
      - name: the shaders match their sources
        run: |
          python3 scripts/build_shaders.py
          git diff --exit-code src/shaders

      - name: the device renders, dispatches and reads back
        env:
          MOONWGPU_VULKAN_LIVE: "1"
        run: moon test --target native

      - name: the example runs on the device
        run: moon run src/examples/05-device --target native

  docs:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: post install
        run: |
          moon version --all
          moon update

      # Every block marked `moonbit check` in the README and in the skill has to
      # compile against this package. The script builds a throwaway package,
      # checks it, and removes it again.
      - name: the code in the docs compiles
        run: python3 scripts/check_snippets.py
